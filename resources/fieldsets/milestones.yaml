title: Meilensteine
fields:
  -
    handle: subtitle
    field:
      type: text
      display: Übertitel
      instructions: 'Steht klein über dem Titel, z. B. «Unsere Geschichte:».'
  -
    handle: title
    field:
      type: text
      display: Titel
  -
    handle: text
    field:
      type: textarea
      display: Text
      instructions: 'Einleitung unter dem Titel, zentriert ausgegeben.'
  -
    handle: slides
    field:
      type: grid
      display: Meilensteine
      instructions: 'Ein Eintrag pro Slide, in chronologischer Reihenfolge.'
      mode: stacked
      add_row: 'Meilenstein hinzufügen'
      fields:
        -
          handle: year
          field:
            type: text
            display: Jahr
            instructions: 'Wird am Zeitstrahl ausgegeben.'
        -
          handle: image
          field:
            type: assets
            display: Bild
            instructions: 'Wird quadratisch beschnitten. Ohne Bild steht an seiner Stelle eine leere Fläche.'
            container: assets
            max_files: 1
            mode: list
        -
          handle: image_contain
          field:
            type: toggle
            display: 'Bild nicht beschneiden'
            instructions: 'Für Grafiken, Inserate und Screenshots: Das ganze Bild wird ins Quadrat eingepasst.'
        - import: editor
  -
    handle: button_title
    field:
      type: text
      display: 'Titel neben dem Button'
      instructions: 'Steht links neben dem Button unter dem Zeitstrahl.'
  - import: button
  -
    handle: merger_tree
    field:
      type: toggle
      display: Fusionsgeschichte
      instructions: 'Der Button klappt unter dem Zeitstrahl die interaktive Fusionsgeschichte auf, statt auf das Button-Ziel zu verlinken.'
  -
    handle: merger_tree_title
    field:
      type: text
      display: 'Titel der Fusionsgeschichte'
      if:
        merger_tree: 'equals true'
  -
    handle: merger_tree_text
    field:
      type: textarea
      display: 'Text der Fusionsgeschichte'
      instructions: 'Einleitung unter dem Titel der Fusionsgeschichte.'
      if:
        merger_tree: 'equals true'
