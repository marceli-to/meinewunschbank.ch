{{#
  @param href    - When set, renders an <a>; otherwise a <button type="button">.
  @param variant - 'primary' (default, brand bg) or 'inverted' (white bg, for
                   use on the brand background, e.g. the post teaser card).
  @param on      - Alpine @click expression for the <button> variant.
  @param label   - aria-label.
  @param class   - Extra classes.
  @param slot    - Button label / content.

  `btn` marks it exempt from the `article a:not(.btn)` underline rule.
#}}
{{ if href }}
  <a
    href="{{ href }}"
    {{ if label }}aria-label="{{ label }}"{{ /if }}
    class="btn inline-flex w-auto font-bold text-[16px] lg:text-[18px] leading-none px-16 py-10 md:px-20 md:py-12 lg:px-32 lg:py-14 rounded-full no-underline bg-brand text-white hover:bg-crimson transition-colors {{ class }}">
    {{ slot }}
  </a>
{{ else }}
  <button
    type="button"
    {{ if on }}@click="{{ on }}"{{ /if }}
    {{ if label }}aria-label="{{ label }}"{{ /if }}
    class="btn inline-flex w-auto font-bold text-[16px] lg:text-[18px] leading-none px-16 py-10 md:px-20 md:py-12 lg:px-32 lg:py-14 rounded-full no-underline cursor-pointer bg-brand text-white hover:bg-crimson transition-colors {{ class }}">
    {{ slot }}
  </button>
{{ /if }}
