{{#
  Zentrierter Inhaltsrahmen mit den Standard-Seitenrändern.
  @param compact - mit compact="true" die schmale Variante (74rem) statt 90rem.
  @param spacing - vertikale Abstände, z. B. py-20 md:py-28.
  @param class - zusätzliche Klassen.
#}}
<div class="{{ if compact }}max-w-[74rem]{{ else }}max-w-[90rem]{{ /if }} mx-auto px-20 md:px-32 xl:px-44 {{ spacing ?? '' }} {{ class }}">
  {{ slot }}
</div>
