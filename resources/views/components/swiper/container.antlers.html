{{#
  Must sit inside an element carrying data-swiper-scope: app.js initialises one
  Swiper per scope, which is what pairs a container with its buttons.
  @param class - Extra classes.
  @param slot - The slides, each wrapped in components/swiper/item.
#}}
<div class="swiper {{ class }}" data-swiper>
  <div class="swiper-wrapper">
    {{ slot }}
  </div>
</div>
